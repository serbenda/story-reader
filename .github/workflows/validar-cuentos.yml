name: Comprobar cuentos

# Se ejecuta en cada pull request hacia main y en cada subida a development.
# Juega cientos de partidas al azar de cada libro y falla si algún cuento tiene errores.
# Después juega partidas completas con un micrófono simulado y prueba la tienda, la meta, las sílabas, etc.
on:
  pull_request:
    branches: [main]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuentos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar los cuentos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar el navegador de pruebas
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Comprobar el JavaScript
        run: for f in js/*.js js/juego/*.js sw.js; do node --check "$f"; done

      - name: Comprobar todos los cuentos
        run: python herramientas/validar.py todos

      - name: Jugar partidas de prueba
        run: python tests/partidas.py
